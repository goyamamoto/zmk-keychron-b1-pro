name: Release

# Pushing a tag v* builds the firmware from that commit, runs the tests,
# signs a provenance attestation for the files and publishes a GitHub Release
# with the UF2, the third-party notices, the build record and their SHA-256
# sums. Verify a downloaded file with:
#   gh attestation verify keychron-b1-pro.uf2 -R goyamamoto/zmk-keychron-b1-pro
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the attestation with the workflow's identity
      attestations: write # store it in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the firmware in the pinned image
        run: bash scripts/build-firmware.sh
      - name: Host tests
        run: bash scripts/run-host-tests.sh
      - name: ZMK tests on native_sim
        run: bash scripts/run-zmk-tests.sh
      - name: Attest the provenance of the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/firmware/keychron-b1-pro.uf2
            build/firmware/keychron-b1-pro-usjis.uf2
            build/firmware/THIRD-PARTY-NOTICES.txt
            build/firmware/build-info.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd build/firmware
          files=(keychron-b1-pro.uf2 keychron-b1-pro-usjis.uf2 THIRD-PARTY-NOTICES.txt build-info.json)
          sha256sum "${files[@]}" > SHA256SUMS
          version="$(python3 -c 'import json; print(json.load(open("build-info.json"))["build_version"])')"
          {
            echo "Firmware for the Keychron B1 Pro US (PID 0x0711), build \`$version\`."
            echo
            echo "- \`keychron-b1-pro.uf2\`: keys as printed, no Japanese features."
            echo "- \`keychron-b1-pro-usjis.uf2\`: with US-JIS mode (Fn+Tab), IME keys beside Space, Caps Lock and Left Ctrl swapped."
            echo
            echo "Flash one of them as the README describes (reset switch while connecting USB, copy the file to the \`NRF52BOOT\` drive)."
            echo "\`THIRD-PARTY-NOTICES.txt\` lists the components in the firmware and their licenses."
            echo
            echo "The files were built by GitHub Actions from tag \`$TAG\` and carry a signed provenance attestation. To check a download:"
            echo
            echo '```'
            echo "gh attestation verify keychron-b1-pro.uf2 -R $REPO"
            echo '```'
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "${files[@]}" SHA256SUMS
