name: OpenSSF Scorecard

# Weekly supply-chain check of this repository (pinned dependencies, token
# permissions, dangerous workflow patterns, ...). Results go to the Security
# tab and to https://scorecard.dev/viewer/?uri=github.com/goyamamoto/zmk-keychron-b1-pro
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to the Security tab
      id-token: write # publish_results: sign the results for scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          sarif_file: results.sarif
