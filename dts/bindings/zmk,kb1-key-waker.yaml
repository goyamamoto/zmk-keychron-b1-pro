# SPDX-License-Identifier: MIT

description: |
  Idle-sleep wake source: when resumed by ZMK's soft off during idle sleep,
  resumes the given matrix kscan so that a key press wakes the keyboard.
  List it in zmk,soft-off-wakeup-sources.

compatible: "zmk,kb1-key-waker"

include: base.yaml

properties:
  kscan:
    type: phandle
    required: true
