# Version updates for the actions used by the workflows. The firmware's
# sources (config/west.yml) and the build image are pinned on purpose for
# reproducibility and are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before taking a new release, so that a release that is
    # withdrawn as compromised does not reach this repository.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
