name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Provenance attestation of the built firmware (push to main only).
      id-token: write # sign the attestation with the workflow's identity
      attestations: write # store it in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the firmware in the pinned image
        run: bash scripts/build-firmware.sh
      - name: Host tests
        run: bash scripts/run-host-tests.sh
      - name: ZMK tests on native_sim
        run: bash scripts/run-zmk-tests.sh
      - name: Attest the provenance of the firmware
        # Signed statement that these files were built by this workflow from
        # this commit. Not on pull requests: their token cannot sign.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/firmware/keychron-b1-pro.uf2
            build/firmware/keychron-b1-pro-usjis.uf2
      - name: Keep the firmware of this commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keychron-b1-pro-${{ github.sha }}
          path: |
            build/firmware/keychron-b1-pro.uf2
            build/firmware/keychron-b1-pro-usjis.uf2
            build/firmware/THIRD-PARTY-NOTICES.txt
            build/firmware/build-info.json
          if-no-files-found: error
